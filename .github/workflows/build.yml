name: Android build

on:
  push:
    branches:
      - master
      - 'arena/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build APK and run Android instrumentation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install upstream Android SDK, NDK and CMake versions
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build clean upstream release APK and test APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          :TMessagesProj_App:assembleAfatRelease
          :TMessagesProj_AppTests:assembleAfatDebug

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :TMessagesProj_AppTests:connectedAfatDebugAndroidTest

      - name: Upload baseline APK
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: telegram-android-baseline-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: telegram-android-test-reports-${{ github.sha }}
          path: |
            TMessagesProj_AppTests/build/outputs/androidTest-results/connected/**
            TMessagesProj_AppTests/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
